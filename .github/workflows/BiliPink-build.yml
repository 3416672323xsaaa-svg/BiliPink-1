name: 构建 APK

on:
  workflow_dispatch:

concurrency:
  group: build-apk-task
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Buildozer编译APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: android debug
          workdir: ./

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink‑APK
          path: ./bin/*.apk
