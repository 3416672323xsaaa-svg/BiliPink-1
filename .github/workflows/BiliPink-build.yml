name: Build Kivy Android APK In Debug Mode

on:
  workflow_dispatch

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtiff5-dev libjpeg-dev libpng-dev libfreetype6-dev libffi-dev libssl-dev libcairo2-dev

    - name: Install buildozer
      run: |
        pip3 install --upgrade pip
        pip3 install buildozer python-for-android

    - name: Build APK
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: built-apk
        path: bin/*.apk

    - name: Upload logs
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: buildozer.log
