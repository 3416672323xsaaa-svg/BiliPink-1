name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Increase swap memory
        run: |
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv openjdk-17-jdk unzip git

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare buildozer environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install cython buildozer==1.5.0

      - name: Run buildozer compile
        env:
          APP_ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
          ANDROID_HOME: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
        run: |
          source venv/bin/activate
          yes | buildozer android debug

      - name: Upload built apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: output-apk
          path: ./bin/*.apk
