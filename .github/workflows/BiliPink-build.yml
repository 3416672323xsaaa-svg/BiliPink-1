name: BuildAPK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache
        uses: actions/cache@v3
        with:
          path: .buildozer
          key: bz-cache-v1

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-venv openjdk-17-jdk unzip git

      - name: Set Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare venv
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install cython==3.0.12 buildozer==1.5.0 pyjnius==1.6.1

      - name: Generate buildozer.spec
        run: |
          source venv/bin/activate
          rm -f buildozer.spec
          yes | buildozer init
          sed -i 's/^#android.arch =.*/android.arch = arm64‑v8a/' buildozer.spec
          sed -i 's/^android.permissions.*/android.permissions = INTERNET/' buildozer.spec
          echo "python.package.pyjnius = pyjnius==1.6.1" >> buildozer.spec
          echo "android.ndk.api = 21" >> buildozer.spec
          echo "android.enable_android_openssl = False" >> buildozer.spec

      - name: Build APK
        env:
          ANDROID_HOME: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
          NPROC_MAX: "2"
        run: |
          source venv/bin/activate
          yes | buildozer android debug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: ./bin/*.apk
