name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv openjdk-17-jdk unzip git

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare venv
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install cython buildozer==1.5.0

      - name: Patch spec，只保留最小组件
        run: |
          source venv/bin/activate
          yes | buildozer init
          # 只编译64位，关闭大量不必要组件
          sed -i 's/^#android.arch =.*/android.arch = arm64‑v8a/' buildozer.spec
          sed -i 's/^android.permissions.*/android.permissions = INTERNET/' buildozer.spec

      - name: Build debug apk
        env:
          APP_ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
          ANDROID_HOME: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
          # 限制编译并发线程数，减少内存峰值！核心！！
          NPROC_MAX: "2"
        run: |
          source venv/bin/activate
          yes | buildozer android debug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: output-apk
          path: ./bin/*.apk
