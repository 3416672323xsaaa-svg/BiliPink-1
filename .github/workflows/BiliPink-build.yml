name: Build Kivy Android APK In Debug Mode

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  CYTHON_LANGUAGE_LEVEL: "3"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.java-home=$JAVA_HOME -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config libpng-dev libffi-dev libcairo2-dev libgirepository1.0-dev

    - name: Install python & buildozer
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install buildozer cython pycairo

    - name: Run buildozer debug build
      run: |
        buildozer android debug

    - name: List output directory  # 调试：打印目录看有没有apk
      run: ls -la ./bin/ || echo "bin文件夹不存在，没有生成APK"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: built-apk
        path: ./bin/*.apk
