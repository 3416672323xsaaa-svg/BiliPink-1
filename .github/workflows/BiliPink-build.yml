name: Build Kivy Android APK (Produce downloadable apk)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: read
  checks: read

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  CYTHON_LANGUAGE_LEVEL: "3"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.java.home=$JAVA_HOME -Dorg.gradle.jvmargs=-Xmx2048m"
  NPROC_MAX: "1"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project source code
        uses: actions/checkout@v4

      - name: Cache buildozer build files
        uses: actions/cache@v3
        with:
          path: .buildozer
          key: bz-kivy-v2

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev curl libcairo2-dev wget unzip

      - name: Download Android SDK command‑line‑tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          rm cmdline.zip
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "build-tools;37.0.0" "platforms;android33"

      - name: Install Buildozer & Kivy packages
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy kivymd python-for-android

      - name: Compile APK with Buildozer
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          java -version
          python --version
          buildozer --version
          export BUILDOZER_ALLOW_PLATFORM_EXEC=1
          export USE_COLORS=0
          buildozer android debug 2>&1 | tee buildozer.log
          mkdir -p ./output_apk
          find .buildozer/android/platform/android/app/build/outputs/apk -name "*.apk" -exec cp {} ./output_apk/ \;

      - name: Verify APK generated
        id: check_apk
        run: |
          if [ -n "$(ls ./output_apk/*.apk 2>/dev/null)" ]; then
            echo "BUILD_OK=true" >> $GITHUB_OUTPUT
            ls ./output_apk/
          else
            echo "No APK generated!"
            exit 1
          fi

      - name: Upload built APK artifact
        uses: actions/upload-artifact@v4
        if: steps.check_apk.outputs.BUILD_OK == 'true'
        with:
          name: BiliPink-APK
          path: ./output_apk/*.apk
