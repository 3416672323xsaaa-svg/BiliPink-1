name: Build Kivy APK Final

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev libltdl-dev openjdk-17-jdk

      - name: Install python packages
        run: |
          python3 -m pip install --upgrade pip
          pip3 install buildozer cython==0.29.33 kivy kivymd python-for-android

      - name: Generate release keystore
        id: genkey
        run: |
          KEYFILE=app-release.keystore
          if [ ! -f "$KEYFILE" ];then
            keytool -genkey -v -keystore $KEYFILE -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=dev,OU=dev,O=dev,L=local,ST=local,C=CN"
            echo "NEW_KEY=true" >> $GITHUB_OUTPUT
          else
            echo "NEW_KEY=false" >> $GITHUB_OUTPUT
          fi

      - name: Build buildozer release apk
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          rm -rf .buildozer build.log output-release.apk
          export BUILDOZER_ALLOW_PLATFORM_EXEC=1
          export P4A_RELEASE_KEYSTORE="$PWD/app-release.keystore"
          export P4A_RELEASE_KEYALIAS="appkey"
          export P4A_RELEASE_KEYSTORE_PASSWD="android"
          export P4A_RELEASE_KEYALIAS_PASSWD="android"
          buildozer -v android release 2>&1 | tee build.log
          find . -name "*.apk" -exec cp {} ./output-release.apk \; 2>/dev/null || true

      - name: Detect build result
        id: detect
        run: |
          if [ -f "./output-release.apk" ];then
            echo "SUCCESS=yes" >> $GITHUB_OUTPUT
            ls -lh ./output-release.apk
          else
            echo "SUCCESS=no" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK artifact
        if: steps.detect.outputs.SUCCESS == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-APK
          path: ./output-release.apk
          retention-days: 14

      - name: Upload keystore file
        if: steps.genkey.outputs.NEW_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: ./app-release.keystore
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-text
          path: ./build.log
          retention-days: 7
