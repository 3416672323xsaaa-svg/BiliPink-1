name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - uses: actions/checkout@v4

      - name: Buildozer build
        uses: ArtemSBulgakov/buildozer‑action@v1
        with:
          python‑version: "3.11"

      - name: Upload generated APK
        uses: actions/upload‑artifact@v4
        with:
          name: bilipink‑apk
          path: bin/*.apk
