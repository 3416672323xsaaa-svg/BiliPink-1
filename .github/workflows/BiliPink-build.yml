name: Build Kivy Android APK FinalTry
on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  ANDROID_SDK_ROOT: $GITHUB_WORKSPACE/android-sdk
  ANDROID_HOME: $GITHUB_WORKSPACE/android-sdk

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system libs
        run: |
          sudo apt‑get update
          sudo apt‑get install ‑y git zip unzip wget autoconf libtool pkg‑config cmake libffi‑dev libssl‑dev curl

      - name: Pre‑fetch offline Android SDK bundle
        run: |
          mkdir -p $ANDROID_SDK_ROOT
          wget -q https://github.com/lzhiyong/android-sdk-bundle/releases/download/sdk37/android-sdk‑bundle‑37.tar.xz -O sdk.tar.xz
          tar -xf sdk.tar.xz -C $ANDROID_SDK_ROOT
          rm -f sdk.tar.xz
          ls -la $ANDROID_SDK_ROOT

      - name: Install buildozer & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy kivymd python‑for‑android

      - name: Build debug APK
        run: |
          buildozer android debug

      - name: Prepare output folder
        run: |
          mkdir -p ./out_apk
          find ./.buildozer/android/platform/android/app/build/outputs/apk -name "*.apk" -exec cp {} ./out_apk/ \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Final‑APK‑Build
          path: ./out_apk/*.apk
