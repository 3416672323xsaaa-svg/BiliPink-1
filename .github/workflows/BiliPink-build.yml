name: Build Kivy Android APK In Debug Mode

on:
  workflow_dispatch

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtiff5-dev libjpeg-dev libpng-dev libfreetype6-dev libffi-dev libssl-dev libcairo2-dev

    - name: Install buildozer
      run: |
        pip3 install --upgrade pip
        pip3 install buildozer

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec <<'EOF'
[app]
title = BiliPink
package.name = bilipink
package.domain = org.bilipink
source.dir = .
source.include_exts = py,png,jpg,jpeg,json,ttf
source.exclude_dirs = tests, bin, .git
package.version = 0.1
app.mainmodule = main.py
requirements = python3,kivy==2.3.0,kivymd==1.2.0,requests
android.api = 33
android.ndk = 25b
android.accept_sdk_license = True
android.permissions = INTERNET,MANAGE_EXTERNAL_STORAGE,READ_MEDIA_VIDEO,READ_MEDIA_AUDIO
android.allow_backup = True
orientation = portrait
android.add_assets = NotoSansSC-Regular.ttf,assets
log_level = 2

[buildozer]
log_level = 2
warn_on_root = 0
EOF

    - name: Build APK
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: built-apk
        path: bin/*.apk

    - name: Upload logs
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: buildozer.log
