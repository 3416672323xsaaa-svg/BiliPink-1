name: Build Kivy Android APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"
  CYTHON_LANGUAGE_LEVEL: "3"
  # 改动1：切回官方源，避免镜像源 404
  PIP_INDEX_URL: https://pypi.org/simple

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    # ==========================
    # 获取代码
    # ==========================
    - name: Checkout code
      uses: actions/checkout@v4

    # ==========================
    # Java 17
    # ==========================
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    # ==========================
    # Python 3.11
    # ==========================
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # ==========================
    # Linux依赖
    # ==========================
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          zip \
          unzip \
          gettext \
          autoconf \
          automake \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          cmake \
          libffi-dev \
          libssl-dev \
          libltdl-dev \
          libcairo2-dev \
          libgirepository1.0-dev \
          openjdk-17-jdk \
          autoconf-archive

    # ==========================
    # Android SDK
    # 改动2：去掉 || true，让失败立刻暴露，并打印已安装组件
    # ==========================
    - name: Install Android SDK
      run: |
        SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -name sdkmanager 2>/dev/null | head -1)
        if [ -z "$SDKMANAGER" ]; then
          echo "sdkmanager not found under $ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT" || true
          exit 1
        fi
        echo "Using SDK Manager: $SDKMANAGER"
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
        "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"
        echo "--- installed packages ---"
        "$SDKMANAGER" --list_installed || true

    # ==========================
    # 安装Buildozer
    # 改动3：分开安装，便于定位是哪个包出问题
    # ==========================
    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip setuptools wheel --retries 10
        pip install --retries 10 buildozer
        pip install --retries 10 "cython==0.29.36"
        pip install --retries 10 python-for-android
        pip install --retries 10 kivy kivymd

    # ==========================
    # 检查环境
    # ==========================
    - name: Check environment
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        java -version
        python --version
        pip list | grep -iE "buildozer|cython|python-for-android|kivy"
        buildozer --version

    # ==========================
    # 创建签名
    # ==========================
    - name: Create keystore
      id: keystore
      run: |
        if [ ! -f release.keystore ]; then
          keytool \
            -genkeypair \
            -v \
            -keystore release.keystore \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android"
          echo "new=true" >> $GITHUB_OUTPUT
        else
          echo "new=false" >> $GITHUB_OUTPUT
        fi

    # ==========================
    # 检查项目
    # ==========================
    - name: Check files
      run: |
        ls -la
        if [ ! -f main.py ]; then
          echo "main.py missing"
          exit 1
        fi
        if [ ! -f buildozer.spec ]; then
          echo "buildozer.spec missing"
          exit 1
        fi
        echo "--- buildozer.spec 关键配置 ---"
        grep -E "^(title|package.name|package.domain|requirements|android.api|android.minapi|android.ndk)" buildozer.spec || true

    # ==========================
    # 构建APK
    # 改动4：加 set -o pipefail，避免 tee 吞掉真实退出码
    # ==========================
    - name: Build APK
      run: |
        set -o pipefail
        export PATH="$HOME/.local/bin:$PATH"
        export BUILDOZER_ALLOW_PLATFORM_EXEC=1
        export P4A_RELEASE_KEYSTORE="$PWD/release.keystore"
        export P4A_RELEASE_KEYALIAS="release"
        export P4A_RELEASE_KEYSTORE_PASSWD="android"
        export P4A_RELEASE_KEYALIAS_PASSWD="android"
        buildozer -v android release 2>&1 | tee buildozer.log

    # ==========================
    # 失败时输出错误摘要（方便直接在 Actions 页面看）
    # ==========================
    - name: Show error summary
      if: failure()
      run: |
        if [ -f buildozer.log ]; then
          echo "===== 第一个错误附近的内容 ====="
          grep -n -iE "error|failed|exception|404" buildozer.log | head -40
        else
          echo "buildozer.log 不存在"
        fi

    # ==========================
    # 收集APK
    # ==========================
    - name: Collect APK
      run: |
        mkdir -p output
        find . -name "*.apk" -exec cp {} output/ \;
        echo "APK output:"
        ls -la output
        if [ ! "$(ls -A output)" ]; then
          echo "No APK generated"
          exit 1
        fi

    # ==========================
    # 上传APK
    # ==========================
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Android-APK
        path: output/*.apk
        retention-days: 30

    # ==========================
    # 上传签名
    # ==========================
    - name: Upload keystore
      if: steps.keystore.outputs.new == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Android-keystore
        path: release.keystore
        retention-days: 1

    # ==========================
    # 上传日志
    # ==========================
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-log
        path: buildozer.log
        retention-days: 7
