name: 构建 APK
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y python3-pip build-essential git libffi-dev libssl-dev libpython3-dev openjdk-17-jdk unzip wget

      - name: 安装Buildozer
        run: |
          pip3 install --user --upgrade buildozer cython

      - name: 创建assets目录，自动下载arm64 ffmpeg
        run: |
          mkdir -p assets
          wget https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linuxarm64-gpl.tar.xz
          mv ffmpeg-master-latest-linuxarm64-gpl/bin/ffmpeg assets/
          chmod +x assets/ffmpeg

      - name: 接受Android SDK协议
        run: yes | sdkmanager --licenses || true

      - name: 构建APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          buildozer android debug deploy run
