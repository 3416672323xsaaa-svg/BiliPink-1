name:构建Kivy APK
on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 缓存buildozer依赖
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            ~/.python-for-android
          key: ${{ runner.os }}‑buildozer‑v1

      - name: 设置JDK17
        uses: actions/setup‑java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装系统依赖
        run: |
          sudo apt‑get update
          sudo apt‑get install‑y python3‑pip python3‑venv git unzip libffi‑dev libssl‑dev autoconf automake libtool patch cmake

      - name: 安装buildozer
        run: |
          python3‑m venv venv
          source venv/bin/activate
          pip install buildozer

      - name: 执行打包release
        run: |
          source venv/bin/activate
          export PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
          buildozer android release

      - name: 强制检查APK是否生成，找不到直接报错
        run: |
          ls -la bin/
          if [ ! -f bin/*.apk ];then echo "❌没有生成APK！构建失败";exit 1;fi

      - name: 上传APK工件
        uses: actions/upload‑artifact@v4
        with:
          name: App‑APK文件
          path: bin/*.apk

      - name: 保存完整构建日志
        uses: actions/upload‑artifact@v4
        with:
          name:构建日志文本
          path: buildozer.log
