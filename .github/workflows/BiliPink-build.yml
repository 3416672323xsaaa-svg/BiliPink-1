name: Build Kivy Android APK In Debug Mode

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

env:
  CYTHON_LANGUAGE_LEVEL: "3"
  P4A_BOOTSTRAP_DOWNLOAD_HOST: https://mirror.ghproxy.com
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"
  P4A_ANDROID_SDK: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_HOME: ${{ github.workspace }}/android-sdk

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev curl libltdl-dev libcairo2-dev libgirepository1.0-dev

      - name: Install Android SDK & Build‑Tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"
          echo "PATH=$ANDROID_SDK_ROOT/build-tools/33.0.2:$PATH" >> $GITHUB_ENV
          echo "P4A_ANDROID_SDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy requests
          pip install python-for-android

      - name: Build APK with Buildozer
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export P4A_ANDROID_SDK=$ANDROID_SDK_ROOT
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          buildozer --version
          buildozer -v android debug 2>&1 | tee buildozer.log
          find . -type f -name "*.apk" -print -exec cp {} ./ \;

      - name: Check if APK was built
        id: check-build
        run: |
          if ls *.apk 1> /dev/null 2>&1; then
            echo "BUILD_FINAL_SUCCESS=true" >> $GITHUB_OUTPUT
            echo "找到APK文件:"
            ls -la *.apk
          else
            echo "BUILD_FINAL_SUCCESS=false" >> $GITHUB_OUTPUT
            echo "没有找到APK"
          fi

      - name: Upload APK artifact
        if: steps.check-build.outputs.BUILD_FINAL_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kivy-app-apk
          path: ./*.apk
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: buildozer.log
          retention-days: 7
