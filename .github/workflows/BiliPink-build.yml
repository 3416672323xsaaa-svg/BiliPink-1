name: 构建安卓

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip zip unzip openjdk-17-jdk libffi-dev libssl-dev autoconf automake libtool

      - name: 安装Python依赖与buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer

      - name: Buildozer初始化&构建Release APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          java -version
          buildozer init
          buildozer -v android release 2>&1 | tee buildozer.log
          # 查找全部apk，打印路径，复制到工作流根目录
          find . -name "*.apk" -print > apks_found.txt
          cat apks_found.txt
          APK_PATH=$(head -n1 apks_found.txt)
          cp -v "$APK_PATH" ./app-release.apk
          ls -la ./*.apk

      - name: 上传密钥库工件
        uses: actions/upload-artifact@v4
        with:
          name: 安卓密钥库
          path: |
            ./.buildozer/android/platform/android-keystore/*.keystore
          retention-days: 1

      - name: 上传APK构建产物
        uses: actions/upload-artifact@v4
        with:
          name: kivy-app-build
          path: ./app-release.apk
          retention-days: 1

      - name: 上传编译日志
        uses: actions/upload-artifact@v4
        with:
          name: 构建日志
          path: ./buildozer.log
          retention-days: 1
