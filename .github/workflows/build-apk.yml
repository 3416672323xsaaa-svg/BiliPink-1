[app]

package.name = bilipink
package.domain = org.bilipink

# 这里就是报错缺失的 title
title = BiliPink

package.version = 0.1

# 缺失 source.dir，代码就在当前目录
source.dir = .
source.main = main.py

requirements = python3,kivy,yt-dlp==2026.4.12,requests

source.include_exts = py,png,jpg,json,txt,html,xml
source.exclude_exts = spec
source.exclude_dirs = tests, bin, .github, __pycache__

# 废弃字段 android.bootstrap → 替换成 p4a.bootstrap
p4a.bootstrap = sdl2

android.api = 33
android.ndk = 25b
android.sdk = 24

android.permissions = INTERNET,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE
android.orientation = portrait
android.debug = True
android.python_optimize = 0

[buildozer]
log_level = 2
warn_on_root = 0
