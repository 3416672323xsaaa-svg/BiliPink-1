name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config


      - name: Install buildozer
        run: |
          pip3 install --user buildozer==1.5.0
          pip3 install --user cython==0.29.36
          export PATH=$PATH:$HOME/.local/bin
          buildozer --version


      - name: Build APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          buildozer -v android debug 2>&1 | tee build.log


      - name: Find APK
        run: |
          echo "Searching APK..."
          find . -name "*.apk"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            **/bin/*.apk
            **/*.apk
          if-no-files-found: error


      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
