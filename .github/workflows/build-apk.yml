name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v4


      # 安装基础环境
      - name: Install Linux dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake


      # Python 编译环境
      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip

          pip3 install \
            buildozer \
            cython==0.29.36 \
            virtualenv


      # 安装 Android SDK 全套
      - name: Setup Android SDK
        run: |

          yes | sdkmanager --licenses || true

          sdkmanager \
          "platform-tools" \
          "cmdline-tools;latest" \
          "platforms;android-35" \
          "platforms;android-36" \
          "build-tools;35.0.0" \
          "build-tools;36.0.0" \
          "build-tools;37.0.0" \
          "extras;google;m2repository" \
          "extras;android;m2repository"


      # 编译 APK
      - name: Build APK
        run: |

          buildozer android clean

          buildozer android debug


      # 查找 APK
      - name: Find APK
        run: |
          find . -name "*.apk"


      # 保存 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-APK
          path: |
            bin/*.apk


      # 保存日志
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            buildozer.log
