name: 构建 APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y python3-pip build-essential git libffi-dev libssl-dev libpython3-dev openjdk-17-jdk unzip
      - name: 安装buildozer
        run: pip3 install --user buildozer cython
      - name: 编译APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          buildozer android debug
      - name: 输出产物
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-APK
          path: bin/*.apk
