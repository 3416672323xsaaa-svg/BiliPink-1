name: Build APK

on:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-22.04

    timeout-minutes: 120


    steps:

    - name: Checkout
      uses: actions/checkout@v4



    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          python3-pip \
          git \
          unzip \
          autoconf \
          automake \
          libtool \
          pkg-config \
          zlib1g-dev


        python3 -m pip install --upgrade pip

        pip3 install \
          buildozer \
          cython==0.29.36



    - name: Clean old cache
      run: |

        rm -rf ~/.buildozer



    - name: Build APK
      run: |

        yes | buildozer android debug



    - name: Upload APK
      uses: actions/upload-artifact@v4

      with:

        name: BiliPink-APK

        path: "**/*.apk"
