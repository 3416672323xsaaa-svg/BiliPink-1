name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config


      - name: Install buildozer
        run: |
          pip3 install --user buildozer==1.5.0
          pip3 install --user cython==0.29.36
          export PATH=$PATH:$HOME/.local/bin
          buildozer --version


      - name: Build APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          buildozer -v android debug 2>&1 | tee build.log


      - name: Find APK
        run: |
          echo "Searching APK..."
          find . -type f -name "*.apk" -print || true


      - name: Prepare APK
        run: |
          mkdir -p output

          echo "Searching APK locations..."

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            echo "===== Current files ====="
            ls -R
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          cp "$APK" output/BiliPink.apk

          echo "Output:"
          ls -lh output/


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-APK
          path: output/BiliPink.apk
          if-no-files-found: error


      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
