name: Build APK

on:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-22.04

    timeout-minutes: 60


    env:

      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Cache build files
      uses: actions/cache@v4
      with:

        path: |
          ~/.buildozer
          ~/.gradle

        key: buildozer-${{ runner.os }}



    - name: Install system packages
      run: |

        sudo apt update


        sudo apt install -y \
        python3 \
        python3-pip \
        python3-setuptools \
        python3-wheel \
        git \
        zip \
        unzip \
        openjdk-17-jdk \
        autoconf \
        automake \
        libtool \
        pkg-config \
        zlib1g-dev \
        libncurses5-dev \
        libncursesw5-dev \
        cmake \
        wget



    - name: Python environment
      run: |

        python3 -m pip install --upgrade pip setuptools wheel


        pip3 install \
        buildozer \
        cython==0.29.36



    - name: Android SDK setup
      run: |


        yes | sdkmanager --licenses || true


        sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0" \
        "cmdline-tools;latest"



    - name: Fix permissions
      run: |

        chmod +x buildozer.spec || true



    - name: Build APK
      run: |

        buildozer android clean

        buildozer -v android debug



    - name: Find APK
      run: |

        echo "APK列表："

        find . -type f -name "*.apk"



    - name: Upload APK
      uses: actions/upload-artifact@v4

      with:

        name: BiliPink-APK

        path: |
          **/*.apkname: Build APK
