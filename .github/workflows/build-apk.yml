name: 构建 APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            build-essential \
            git \
            libffi-dev \
            libssl-dev \
            libpython3-dev \
            openjdk-17-jdk \
            unzip

      - name: 安装 Buildozer
        run: |
          pip3 install --user --upgrade buildozer cython

      - name: 构建APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # 强制指定 ndk r25b，避开高版本ndk编译bug
          buildozer android debug --ndk=r25b

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-APK
          path: bin/*.apk
