name: 构建 APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: 检出代码
        uses: actions/checkout@v4


      - name: 安装环境
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            python3-venv \
            git \
            zip \
            unzip \
            openjdk-17-jdk


      - name: 安装 Buildozer
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user buildozer cython==0.29.37


      - name: 添加 PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH


      - name: 安装 Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "build-tools;34.0.0"


      - name: 修复 AIDL
        run: |
          sudo ln -sf $ANDROID_HOME/build-tools/35.0.0/aidl /usr/bin/aidl
          aidl --version || true


      - name: 编译 APK
        run: |
          buildozer -v android debug


      - name: 保存 APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-APK
          path: bin/*.apk
