name: Build APK

on:
  push:
    branches:
      - main


jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
        git \
        zip \
        unzip \
        openjdk-17-jdk \
        autoconf \
        automake \
        libtool \
        pkg-config \
        libffi-dev \
        libssl-dev \
        zlib1g-dev


    - name: Install build tools
      run: |
        pip install --upgrade pip

        pip install \
        cython==0.29.33 \
        buildozer==1.5.0


    - name: Clean old build
      run: |
        rm -rf .buildozer


    - name: Build APK
      run: |
        buildozer -v android debug


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
