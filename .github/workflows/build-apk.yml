name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install Buildozer
      run: |
        sudo apt update
        sudo apt install -y unzip zip wget
        pip install --upgrade pip
        pip install buildozer cython


    - name: Setup Android SDK
      run: |

        mkdir -p $HOME/android-sdk

        cd $HOME/android-sdk

        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

        unzip commandlinetools-linux-11076708_latest.zip


        mkdir -p cmdline-tools/latest


        mv cmdline-tools/bin cmdline-tools/latest/
        mv cmdline-tools/lib cmdline-tools/latest/
        mv cmdline-tools/NOTICE.txt cmdline-tools/latest/ || true
        mv cmdline-tools/source.properties cmdline-tools/latest/ || true


        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV

        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH


        yes | sdkmanager --licenses


        sdkmanager \
        "platform-tools" \
        "platforms;android-34" \
        "build-tools;34.0.0"



    - name: Build APK
      run: |
        buildozer android debug


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
