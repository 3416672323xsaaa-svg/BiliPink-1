name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config libncurses5-dev libz-dev libbz2-dev liblzma-dev libsqlite3-dev libffi-dev
      - name: Install Python & buildozer
        run: |
          python3 -m pip install --upgrade pip buildozer --break-system-packages
      - name: Build APK
        run: |
          buildozer android debug deploy run
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-APK
          path: bin/*.apk
