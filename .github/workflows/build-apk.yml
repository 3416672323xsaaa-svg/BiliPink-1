name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            git \
            zip \
            unzip \
            openjdk-17-jdk


      - name: Install Buildozer
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer cython


      - name: Accept Android SDK licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true


      - name: Build APK
        run: |
          buildozer android debug


      - name: Find APK
        run: |
          echo "Searching APK..."
          find . -name "*.apk"


      - name: Prepare APK
        run: |
          mkdir -p output
          APK=$(find . -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          echo "Found APK:"
          echo $APK

          cp "$APK" output/BiliPink.apk

          ls -lh output


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-APK
          path: output/BiliPink.apk


      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            buildozer.log
